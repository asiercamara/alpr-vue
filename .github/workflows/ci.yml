name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Types · Knip · Format · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm security:audit:ci

      - name: Lint
        run: pnpm lint

      - name: Type check (app, workers, e2e)
        run: pnpm typecheck

      - name: Unused code and dependencies (knip)
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Tests with coverage thresholds
        run: pnpm test:coverage
