name: CI

# Light on purpose, to spare the free tier's minutes: production audit, lint,
# types, knip, format, unit tests with coverage and the build of the app and
# the docs (about 30 s). The Playwright e2e suite runs locally with
# `pnpm check:all` before a release.
on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Types · Knip · Format · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (production dependencies)
        run: pnpm security:audit:ci

      - name: Lint
        run: pnpm lint

      - name: Type check (app, workers, e2e)
        run: pnpm typecheck

      - name: Unused code and dependencies (knip)
        run: pnpm knip

      - name: Format check
        run: pnpm format:check

      - name: Tests with coverage thresholds
        run: pnpm test:coverage

      - name: Build app and docs
        run: pnpm build:all
